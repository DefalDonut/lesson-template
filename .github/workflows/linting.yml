name: Linting
on: workflow_dispatch
permissions: 
  contents: write

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: npm ci
      - name: Oxlint
        run: |
            npm run lint > lint-info.md
            cat lint-info.md
      - name: Push-changes
        run: |
            git config --global user.name 'DefalDonut'
            git config --global user.email 'tsaily24@students.oamk.fi'
            git add .
            git commit -m 'Linting report'
            git push
